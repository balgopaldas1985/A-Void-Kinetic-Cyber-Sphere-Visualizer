<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Void Kinetic Cyber-Sphere</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;

        #ui-overlay {

        #ui-overlay h1 {
            font-size: 1.2rem;

        #ui-overlay p {
            font-size: 0.75rem;

        .control-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 20;
            background: rgba(5, 10, 20, 0.85);
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .cyber-btn {
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }
        .cyber-btn:active {
            background: #00ffcc;
            color: #030308;
            box-shadow: 0 0 12px #00ffcc;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>KINETIC // VOID</h1>
        <p>Drag screen to rotate sphere</p>
    </div>

    <div id="canvas-container"></div>

    <div class="control-panel">
        <button class="cyber-btn" id="btn-pulse" onclick="togglePulse()">PULSE</button>
        <button class="cyber-btn" id="btn-color" onclick="cycleTheme()">COLOR</button>
        <button class="cyber-btn" id="btn-reset" onclick="resetCore()">RESET</button>
    </div>

    <script>
        let scene, camera, renderer, coreMesh, outerRings = [], particleSystem;
        let targetRotationX = 0, targetRotationY = 0;
        let isPulsing = true;
        let colorIndex = 0;
        const colorPalette = [0x00ffcc, 0xff0055, 0x9d00ff, 0xffbb00];

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Create Scene & Camera
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030308, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 7;

            // 2. WebGL Renderer Initialization
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 3. Core Geometric Mesh (Icosahedron)
            const coreGeo = new THREE.IcosahedronGeometry(2, 3);
            const coreMat = new THREE.MeshBasicMaterial({
                color: colorPalette[0],
                wireframe: true,
                transparent: true,
                opacity: 0.85
            });
            coreMesh = new THREE.Mesh(coreGeo, coreMat);
            scene.add(coreMesh);

            // Store original vertex coordinates for wave calculation
            coreMesh.geometry.userData = {
                pos: coreGeo.attributes.position.clone()
            };

            // 4. Orbital Cyber Rings
            for (let i = 0; i < 3; i++) {
                const ringGeo = new THREE.TorusGeometry(3 + i * 0.7, 0.02, 16, 100);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: colorPalette[0],
                    transparent: true,
                    opacity: 0.5 - i * 0.1
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.random() * Math.PI;
                ring.rotation.y = Math.random() * Math.PI;
                scene.add(ring);
                outerRings.push(ring);
            }

            // 5. Background Floating Particle Field
            const pGeo = new THREE.BufferGeometry();
            const pCount = 600;
            const pPos = new Float32Array(pCount * 3);
            for (let i = 0; i < pCount * 3; i++) {
                pPos[i] = (Math.random() - 0.5) * 20;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const pMat = new THREE.PointsMaterial({
                size: 0.035,
                color: 0xffffff,
                transparent: true,
                opacity: 0.35
            });
            particleSystem = new THREE.Points(pGeo, pMat);
            scene.add(particleSystem);

            let isDragging = false;
            let previousPointerX = 0, previousPointerY = 0;

            const onPointerDown = (x, y) => {
                isDragging = true;
                previousPointerX = x;
                previousPointerY = y;
            };

            const onPointerMove = (x, y) => {
                if (!isDragging) return;
                let deltaX = x - previousPointerX;
                let deltaY = y - previousPointerY;

                targetRotationY += deltaX * 0.005;
                targetRotationX += deltaY * 0.005;

                previousPointerX = x;
                previousPointerY = y;
            };

            const onPointerUp = () => {
                isDragging = false;
            };

            // Touch event listeners
            window.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });

            window.addEventListener('touchend', onPointerUp);

            // Mouse event listeners for desktop preview
            window.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onPointerUp);

            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.002;

            // Rotation smoothing
            coreMesh.rotation.y += (targetRotationY - coreMesh.rotation.y) * 0.05 + 0.004;
            coreMesh.rotation.x += (targetRotationX - coreMesh.rotation.x) * 0.05 + 0.002;

            // Vertex distortion animation
            const positionAttribute = coreMesh.geometry.attributes.position;
            const originalPos = coreMesh.geometry.userData.pos;

            for (let i = 0; i < positionAttribute.count; i++) {
                let uX = originalPos.getX(i);
                let uY = originalPos.getY(i);
                let uZ = originalPos.getZ(i);

                let wave = isPulsing ? Math.sin(time * 2 + uX * 2 + uY * 2) * 0.18 : 0;
                positionAttribute.setXYZ(i, uX + uX * wave, uY + uY * wave, uZ + uZ * wave);
            }
            positionAttribute.needsUpdate = true;

            // Orbital Ring rotation
            outerRings.forEach((ring, index) => {
                ring.rotation.x += 0.0025 * (index + 1);
                ring.rotation.y += 0.0035 * (index + 1);
            });

            // Ambient background particles drift
            particleSystem.rotation.y -= 0.0006;

            renderer.render(scene, camera);
        }

        function togglePulse() {
            isPulsing = !isPulsing;
        }

        function cycleTheme() {
            colorIndex = (colorIndex + 1) % colorPalette.length;
            const newColor = colorPalette[colorIndex];
            coreMesh.material.color.setHex(newColor);
            outerRings.forEach(r => r.material.color.setHex(newColor));
        }

        function resetCore() {
            targetRotationX = 0;
            targetRotationY = 0;
            coreMesh.rotation.set(0, 0, 0);
            isPulsing = true;
            colorIndex = 0;
            coreMesh.material.color.setHex(colorPalette[0]);
            outerRings.forEach(r => r.material.color.setHex(colorPalette[0]));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
