<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Void Kinetic Sphere</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #030308; font-family: monospace; }
        
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        #ui-overlay {
            position: absolute; top: 20px; left: 20px; color: #00ffcc;
            pointer-events: none; z-index: 10; text-shadow: 0 0 8px #00ffcc;
        }
        #ui-overlay h1 { font-size: 1.2rem; letter-spacing: 2px; }
        #ui-overlay p { font-size: 0.75rem; color: #888; margin-top: 4px; }

        .control-panel {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; z-index: 20; background: rgba(5, 10, 20, 0.7);
            padding: 10px 18px; border-radius: 30px; border: 1px solid rgba(0, 255, 204, 0.3);
            backdrop-filter: blur(8px);
        }

        .cyber-btn {
            background: none; border: 1px solid #00ffcc; color: #00ffcc;
            padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 0.75rem;
            cursor: pointer; transition: all 0.2s ease;
        }
        .cyber-btn:active { background: #00ffcc; color: #000; box-shadow: 0 0 12px #00ffcc; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>KINETIC // VOID</h1>
        <p>Swipe to rotate • Tap to impulse morph</p>
    </div>

    <div id="canvas-container"></div>

    <div class="control-panel">
        <button class="cyber-btn" onclick="togglePulse()">PULSE</button>
        <button class="cyber-btn" onclick="cycleTheme()">COLOR</button>
        <button class="cyber-btn" onclick="warpCore()">WARP</button>
    </div>

    <script>
        let scene, camera, renderer, coreMesh, outerRings = [], particleSystem;
        let targetRotationX = 0, targetRotationY = 0;
        let isPulsing = true;
        let colorIndex = 0;
        const colorPalette = [0x00ffcc, 0xff0055, 0x9d00ff, 0xffbb00];

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030308, 0.03);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 8;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 1. Morphing Geometric Core
            const coreGeo = new THREE.IcosahedronGeometry(2, 3);
            const coreMat = new THREE.MeshBasicMaterial({
                color: colorPalette[0],
                wireframe: true,
                transparent: true,
                opacity: 0.8
            });
            coreMesh = new THREE.Mesh(coreGeo, coreMat);
            scene.add(coreMesh);

            // Save original vertex positions for wave distortions
            coreMesh.geometry.userData = {
                pos: coreGeo.attributes.position.clone()
            };

            // 2. Orbital Cyber Rings
            for (let i = 0; i < 3; i++) {
                const ringGeo = new THREE.TorusGeometry(3 + i * 0.8, 0.02, 16, 100);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: colorPalette[0],
                    transparent: true,
                    opacity: 0.5 - i * 0.1
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.random() * Math.PI;
                ring.rotation.y = Math.random() * Math.PI;
                scene.add(ring);
                outerRings.push(ring);
            }

            // 3. Floating Ambient Particle Field
            const pGeo = new THREE.BufferGeometry();
            const pCount = 800;
            const pPos = new Float32Array(pCount * 3);

            for (let i = 0; i < pCount * 3; i++) {
                pPos[i] = (Math.random() - 0.5) * 20;
            }

            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const pMat = new THREE.PointsMaterial({
                size: 0.04,
                color: 0xffffff,
                transparent: true,
                opacity: 0.4
            });
            particleSystem = new THREE.Points(pGeo, pMat);
            scene.add(particleSystem);

            // Touch Drag Interaction
            let touchX = 0, touchY = 0;
            window.addEventListener('touchstart', (e) => {
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            });

            window.addEventListener('touchmove', (e) => {
                let deltaX = e.touches[0].clientX - touchX;
                let deltaY = e.touches[0].clientY - touchY;

                targetRotationY += deltaX * 0.005;
                targetRotationX += deltaY * 0.005;

                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.002;

            // Smooth rotational momentum
            coreMesh.rotation.y += (targetRotationY - coreMesh.rotation.y) * 0.05 + 0.005;
            coreMesh.rotation.x += (targetRotationX - coreMesh.rotation.x) * 0.05 + 0.002;

            // Wave Vertex Distortion (Kinetic Effect)
            const positionAttribute = coreMesh.geometry.attributes.position;
            const originalPos = coreMesh.geometry.userData.pos;

            for (let i = 0; i < positionAttribute.count; i++) {
                let uX = originalPos.getX(i);
                let uY = originalPos.getY(i);
                let uZ = originalPos.getZ(i);

                let wave = isPulsing ? Math.sin(time * 2 + uX * 2 + uY * 2) * 0.2 : 0;

                positionAttribute.setXYZ(i, uX + uX * wave, uY + uY * wave, uZ + uZ * wave);
            }
            positionAttribute.needsUpdate = true;

            // Orbit Ring Motion
            outerRings.forEach((ring, index) => {
                ring.rotation.x += 0.003 * (index + 1);
                ring.rotation.y += 0.004 * (index + 1);
            });

            // Ambient drift
            particleSystem.rotation.y -= 0.0008;

            renderer.render(scene, camera);
        }

        function togglePulse() {
            isPulsing = !isPulsing;
        }

        function cycleTheme() {
            colorIndex = (colorIndex + 1) % colorPalette.length;
            const newColor = colorPalette[colorIndex];
            coreMesh.material.color.setHex(newColor);
            outerRings.forEach(r => r.material.color.setHex(newColor));
        }

        function warpCore() {
            targetRotationX += (Math.random() - 0.5) * 6;
            targetRotationY += (Math.random() - 0.5) * 6;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
  </html>
