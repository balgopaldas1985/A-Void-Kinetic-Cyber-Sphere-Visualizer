<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Void Kinetic Sphere</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #030308; font-family: monospace; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #ui-overlay {
            position: absolute; top: 20px; left: 20px; color: #00ffcc;
            pointer-events: none; z-index: 10; text-shadow: 0 0 8px #00ffcc;
        }
        #ui-overlay h1 { font-size: 1.1rem; letter-spacing: 2px; }
        #ui-overlay p { font-size: 0.75rem; color: #888; margin-top: 4px; }
        .control-panel {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 20; background: rgba(5, 10, 20, 0.8);
            padding: 10px 14px; border-radius: 30px; border: 1px solid rgba(0, 255, 204, 0.4);
        }
        .cyber-btn {
            background: none; border: 1px solid #00ffcc; color: #00ffcc;
            padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 0.75rem;
            cursor: pointer;
        }
        .cyber-btn:active { background: #00ffcc; color: #000; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>KINETIC VOID</h1>
        <p>Drag thumb to rotate sphere</p>
    </div>

    <div id="canvas-container"></div>

    <div class="control-panel">
        <button class="cyber-btn" onclick="togglePulse()">PULSE</button>
        <button class="cyber-btn" onclick="cycleTheme()">COLOR</button>
        <button class="cyber-btn" onclick="resetCore()">RESET</button>
    </div>

    <script>
        let scene, camera, renderer, coreMesh, outerRings = [];
        let targetRotationX = 0, targetRotationY = 0;
        let isPulsing = true, colorIndex = 0;
        const colorPalette = [0x00ffcc, 0xff0055, 0x9d00ff, 0xffbb00];

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030308, 0.03);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 7;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const coreGeo = new THREE.IcosahedronGeometry(2, 3);
            const coreMat = new THREE.MeshBasicMaterial({
                color: colorPalette[0],
                wireframe: true,
                transparent: true,
                opacity: 0.85
            });
            coreMesh = new THREE.Mesh(coreGeo, coreMat);
            scene.add(coreMesh);

            coreMesh.geometry.userData = { pos: coreGeo.attributes.position.clone() };

            for (let i = 0; i < 3; i++) {
                const ringGeo = new THREE.TorusGeometry(3 + i * 0.7, 0.02, 16, 80);
                const ringMat = new THREE.MeshBasicMaterial({ color: colorPalette[0], transparent: true, opacity: 0.4 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.random() * Math.PI;
                ring.rotation.y = Math.random() * Math.PI;
                scene.add(ring);
                outerRings.push(ring);
            }

            let touchX = 0, touchY = 0;
            window.addEventListener('touchstart', (e) => {
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            });

            window.addEventListener('touchmove', (e) => {
                let deltaX = e.touches[0].clientX - touchX;
                let deltaY = e.touches[0].clientY - touchY;
                targetRotationY += deltaX * 0.005;
                targetRotationX += deltaY * 0.005;
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.002;

            coreMesh.rotation.y += (targetRotationY - coreMesh.rotation.y) * 0.05 + 0.004;
            coreMesh.rotation.x += (targetRotationX - coreMesh.rotation.x) * 0.05 + 0.002;

            const positionAttribute = coreMesh.geometry.attributes.position;
            const originalPos = coreMesh.geometry.userData.pos;

            for (let i = 0; i < positionAttribute.count; i++) {
                let uX = originalPos.getX(i);
                let uY = originalPos.getY(i);
                let uZ = originalPos.getZ(i);
                let wave = isPulsing ? Math.sin(time * 2 + uX * 2 + uY * 2) * 0.2 : 0;
                positionAttribute.setXYZ(i, uX + uX * wave, uY + uY * wave, uZ + uZ * wave);
            }
            positionAttribute.needsUpdate = true;

            outerRings.forEach((ring, index) => {
                ring.rotation.x += 0.003 * (index + 1);
                ring.rotation.y += 0.004 * (index + 1);
            });

            renderer.render(scene, camera);
        }

        function togglePulse() { isPulsing = !isPulsing; }
        
        function cycleTheme() {
            colorIndex = (colorIndex + 1) % colorPalette.length;
            const newColor = colorPalette[colorIndex];
            coreMesh.material.color.setHex(newColor);
            outerRings.forEach(r => r.material.color.setHex(newColor));
        }

        function resetCore() {
            targetRotationX = 0;
            targetRotationY = 0;
            coreMesh.rotation.set(0,0,0);
            isPulsing = true;
            colorIndex = 0;
            coreMesh.material.color.setHex(colorPalette[0]);
            outerRings.forEach(r => r.material.color.setHex(colorPalette[0]));
        }

        window.onload = init;
    </script>
</body>
  </html>
